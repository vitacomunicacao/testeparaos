<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vita OS — Gestão da Vita Comunicação</title>
<style>
:root{
  --bg:#f3f4f0;--surface:#ffffff;--surface-2:#eef0eb;--text:#111311;--muted:#72776f;--line:#dfe3dc;
  --black:#0d0f0d;--moss:#4f5f43;--olive:#697858;--olive-soft:#e8ece2;--white:#fff;
  --danger:#a8473f;--shadow:0 18px 50px rgba(17,19,17,.07);--shadow-soft:0 8px 24px rgba(17,19,17,.05);--radius:18px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-width:0}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;transition:.22s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:258px;background:var(--black);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:50;transition:transform .3s;box-shadow:18px 0 45px rgba(0,0,0,.08)}
.brand{font-size:24px;font-weight:850;letter-spacing:-1px;padding:6px 12px 34px;display:flex;justify-content:space-between;align-items:center}.brand span{color:#89907f;font-weight:500}.close-menu{display:none;background:transparent;color:#fff;font-size:24px;padding:0}
.nav{display:grid;gap:5px}.nav button{background:transparent;color:#aeb3aa;text-align:left;padding:12px 13px;border-radius:11px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}.nav button:hover{background:#1d211d;color:#fff}.nav button.active{background:#e8ece2;color:#10130f}.nav .restricted{margin-top:14px;border-top:1px solid #292d29;padding-top:18px;color:#fff}
.main{margin-left:258px;width:calc(100% - 258px);padding:34px 42px 50px;transition:.3s}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:18px}.top-left{display:flex;align-items:center;gap:16px}.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);padding:9px 12px;border-radius:10px}.top h1{margin:0;font-size:31px;letter-spacing:-1.2px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}.user{display:flex;gap:11px;align-items:center;text-align:right}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--moss);color:#fff;font-weight:800}
.grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-soft)}.kpi{min-height:132px;position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--olive-soft);right:-38px;bottom:-42px}.kpi .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}.kpi .value{font-size:30px;font-weight:850;margin-top:10px;letter-spacing:-1.4px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}.two{grid-template-columns:1.35fr .9fr}.three{grid-template-columns:repeat(3,1fr)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 13px}.section-title h2{font-size:16px;margin:0;letter-spacing:-.3px}.btn{background:var(--black);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:var(--moss);transform:translateY(-1px)}.btn.secondary{background:var(--surface-2);color:#20241e}.btn.secondary:hover{background:#e1e5dd}.btn.danger{background:#f6e4e2;color:#8e342e}.btn.icon{padding:6px 9px;font-size:13px;background:transparent;color:var(--muted);border:1px solid transparent}.btn.icon:hover{background:#f6e4e2;color:var(--danger);border-color:#e7bbb6}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;outline:none;width:100%;font-size:13px;color:var(--text)}.toolbar input:focus,.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(79,95,67,.09)}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:750;text-transform:uppercase;font-size:10px;letter-spacing:.8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:var(--surface-2);white-space:nowrap}.pill.good{background:#e3ebe0;color:#4d6545}.pill.warn{background:#eee9dc;color:#78633c}.pill.bad{background:#f6e4e2;color:#8e342e}.pill.blue{background:#e5e9e5;color:#4d5b52}.pill.purple{background:#ebe8df;color:#645d4c}
.kanban{display:grid;grid-template-columns:repeat(9,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:15px}.col{background:#e9ece6;border-radius:15px;padding:12px;min-height:450px;border:1px solid #dde2da}.col h3{font-size:10px;margin:4px 3px 12px;color:#687066;text-transform:uppercase;letter-spacing:.7px;display:flex;justify-content:space-between}.col h3 span{background:#dce1d9;padding:2px 7px;border-radius:10px;font-size:10px}.col.drag-over{background:#dde4d8;border:2px dashed #9da993}.content-card{background:#fff;border:1px solid var(--line);padding:14px;border-radius:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.035);cursor:grab;position:relative;transition:.18s}.content-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.06);border-color:#cbd1c7}.content-card:active{cursor:grabbing}.content-card .format-tag{font-size:9px;padding:3px 7px;border-radius:5px;font-weight:800;display:inline-block;margin-bottom:7px}.content-card b{font-size:13px;display:block;margin-bottom:6px;line-height:1.3}.content-card small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.content-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.content-card .assignee{font-size:11px;font-weight:650;color:var(--text)}.delete-btn-card{position:absolute;top:10px;right:10px;background:none;color:var(--muted);display:none;font-size:13px}.content-card:hover .delete-btn-card{display:block;color:var(--danger)}.content-card.link-active:after{content:'↗';position:absolute;bottom:10px;right:10px;font-size:11px;opacity:.45}.content-edit-bar{display:flex;gap:6px;align-items:center;margin-top:9px}.content-edit-btn{border:1px solid var(--line);background:var(--olive-soft);color:var(--moss);border-radius:8px;padding:6px 8px;font-size:10px;font-weight:800}.content-stage,.content-resp{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 7px;font-size:10px;font-weight:700;color:var(--text)}.content-note{font-size:10px;color:var(--muted);background:#f6f7f4;border-radius:8px;padding:7px;margin-top:8px;line-height:1.35}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);transition:.2s}.task:last-child{border-bottom:none}.task.completed{opacity:.58}.task.completed b{text-decoration:line-through;color:var(--muted)}.check{width:18px;height:18px;margin-top:3px;cursor:pointer;accent-color:var(--moss)}.task-main{flex:1;min-width:0}.task-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.task-title-row b{font-size:14px}.task-note{margin:7px 0 0;padding:8px 10px;border-radius:8px;background:#f4f6f2;color:var(--muted);font-size:12px;line-height:1.45}.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:11px}.task-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.status-select,.assignee-select{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.task-edit-btn{background:var(--olive-soft);color:var(--moss);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:750}
.account-switcher{background:transparent!important;color:inherit!important;display:flex;align-items:center;gap:9px;padding:5px;border-radius:12px;text-align:right}.account-switcher:hover{background:#eef1ec!important}.account-chevron{color:var(--muted);font-size:18px;margin-left:2px}.account-grid{display:grid;gap:9px;margin:16px 0}.account-option{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;color:var(--text)}.account-option:hover,.account-option.selected{border-color:#aebaa4;background:#f3f6ef}.account-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e4e9df;color:var(--moss);font-weight:800}.account-option small{display:block;color:var(--muted);margin-top:2px}.account-check{margin-left:auto;color:var(--moss);font-weight:800}
.table-link{background:none;padding:0;text-align:left;color:var(--text)}.table-link:hover{color:var(--moss);text-decoration:underline}.muted{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,12,10,.58);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(7px)}.modal.show{display:flex}.modal-box{background:#fff;border-radius:20px;padding:28px;width:min(520px,92vw);max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-box h2{margin:0 0 20px;font-size:21px;letter-spacing:-.5px}.form{display:grid;gap:14px}.form label{font-size:12px;color:var(--text);font-weight:750;display:grid;gap:6px}.form-actions{display:flex;gap:10px;margin-top:10px;justify-content:flex-end}
#toast-container{position:fixed;bottom:22px;right:22px;z-index:1000;display:flex;flex-direction:column;gap:9px}.toast{background:var(--black);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 12px 28px rgba(0,0,0,.18);animation:slideIn .3s ease forwards;display:flex;align-items:center;gap:8px}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.page{display:none;animation:fadeIn .28s ease}.page.active{display:block}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.card.scroll{overflow-x:auto}
/* Calendário */
.calendar-shell{overflow:hidden;padding:0}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);background:#fff}.calendar-title{display:flex;align-items:center;gap:12px}.calendar-title h2{margin:0;text-transform:capitalize;font-size:20px;letter-spacing:-.7px}.calendar-title span{color:var(--muted);font-size:12px}.calendar-actions{display:flex;align-items:center;gap:7px}.calendar-nav{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px}.calendar-nav:hover{background:var(--olive-soft);color:var(--moss)}.calendar-today{height:36px;padding:0 12px;border-radius:10px;background:var(--black);color:#fff;font-size:11px;font-weight:800}.calendar-today:hover{background:var(--moss)}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));min-width:770px}.calendar-weekday{padding:11px 10px;background:#f5f6f3;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}.calendar-day{min-height:118px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}.calendar-day:hover{background:#f7f8f5}.calendar-day.empty{background:#f3f4f1;cursor:default}.calendar-day.today{box-shadow:inset 0 0 0 2px var(--moss)}.calendar-day.selected{background:#edf1e9}.day-number{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}.today-dot{width:6px;height:6px;background:var(--moss);border-radius:50%}.event{display:block;margin-top:6px;padding:5px 7px;border-radius:7px;font-size:9px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.capture{background:#e9e5d8;color:#75613b}.event.task{background:#e4ebe1;color:#4d6545}.calendar-legend{display:flex;gap:14px;align-items:center;padding:13px 18px;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}.legend-item{display:flex;gap:6px;align-items:center}.legend-dot{width:8px;height:8px;border-radius:3px}.legend-dot.capture{background:#75613b}.legend-dot.task{background:#4d6545}
.day-detail{display:grid;gap:10px}.day-event{padding:12px;border:1px solid var(--line);border-radius:12px;background:#f7f8f5}.day-event strong{display:block;font-size:13px}.day-event small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.empty-state{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;text-align:center}
/* Responsividade: desktop, tablet e celular (inclusive 9:16) */
.vita-user-brand{white-space:nowrap}
.vita-user-brand b{font-size:15px;letter-spacing:-.2px}

@media(max-width:1100px){
  .sidebar{width:220px}
  .main{margin-left:220px;width:calc(100% - 220px);padding:24px 22px 42px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.three{grid-template-columns:1fr}
}

@media(max-width:768px){
  .sidebar{
    transform:translateX(-100%);
    width:270px;
    padding:18px 14px;
  }
  .sidebar.open{transform:translateX(0)}
  .close-menu{display:block}

  .main{
    margin-left:0;
    width:100%;
    min-width:0;
    padding:14px 12px 30px;
  }

  .menu-btn{display:block;flex:0 0 auto}
  .top{
    align-items:center;
    margin-bottom:18px;
    gap:10px;
  }
  .top-left{min-width:0;gap:10px}
  .top h1{
    font-size:22px;
    line-height:1.1;
    letter-spacing:-.7px;
  }
  .top p{
    font-size:11px;
    margin-top:4px;
  }
  .user{display:flex;margin-left:auto}
  .vita-user-brand b{font-size:12px}

  .kpis{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .kpi{
    min-height:112px;
    padding:15px;
  }
  .kpi .value{font-size:24px;margin-top:7px}
  .kpi .label{font-size:10px}
  .kpi .sub{font-size:10px}

  .card{padding:15px;border-radius:15px}
  .section-title{margin:20px 0 10px;gap:10px}
  .section-title h2{font-size:14px}

  .toolbar{
    align-items:stretch;
    width:100%;
  }
  .toolbar > *{max-width:none!important}
  .toolbar .btn{justify-content:center}
  .toolbar > div{width:100%!important;flex-wrap:wrap}
  .toolbar select,.toolbar input{flex:1 1 100%;width:100%!important}

  .table{min-width:650px}
  .card.scroll{-webkit-overflow-scrolling:touch}

  .task{
    gap:9px;
    padding:12px 0;
    flex-wrap:wrap;
  }
  .task-main{flex:1 1 calc(100% - 32px)}
  .task-actions{
    width:100%;
    justify-content:flex-start;
    padding-left:27px;
  }
  .status-select,.assignee-select{flex:1 1 120px}

  .kanban{
    grid-template-columns:repeat(9,minmax(205px,1fr));
    gap:9px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .col{min-height:360px;padding:10px}
  .content-card{padding:12px}

  .calendar-head{
    align-items:flex-start;
    flex-direction:column;
    padding:14px;
  }
  .calendar-actions{
    width:100%;
    justify-content:flex-end;
  }
  .calendar-grid{min-width:700px}
  .calendar-day{min-height:100px}

  .modal-box{
    width:min(94vw,520px);
    max-height:90vh;
    padding:20px 16px;
    border-radius:17px;
  }
  .form-actions{
    flex-wrap:wrap;
  }
  .form-actions .btn{
    flex:1 1 140px;
    justify-content:center;
  }

  #toast-container{
    left:12px;
    right:12px;
    bottom:12px;
  }
  .toast{font-size:12px}
}

@media(max-width:480px){
  .main{padding:12px 10px 26px}
  .top{margin-bottom:14px}
  .top h1{font-size:20px}
  .top p{font-size:10px}
  .vita-user-brand b{font-size:11px}

  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:13px;min-height:105px}
  .kpi .value{font-size:21px}
  .kpi .sub{font-size:9px}

  .two,.three{gap:10px}
  .card{padding:13px}

  .calendar-grid{min-width:680px}
  .calendar-day{min-height:96px;padding:7px}
  .calendar-weekday{padding:9px 7px}

  .btn{padding:9px 11px;font-size:11px}
  .content-edit-bar{flex-direction:column;align-items:stretch}
  .content-stage,.content-resp{width:100%}
}

@media(max-width:360px){
  .vita-user-brand{display:none}
  .kpis{grid-template-columns:1fr}
  .top h1{font-size:19px}
}

  .client-field.full{grid-column:auto}
  .client-header{flex-direction:column}
  .client-header .btn{width:100%;justify-content:center}
}


/* =========================================================
   VITA COMUNICAÇÃO — PREMIUM / MOBILE FIRST
   ========================================================= */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#f8f9fb;
  --border:#e7e9ee;
  --text:#111318;
  --muted:#707783;
  --primary:#111318;
  --primary-2:#2a2f38;
  --shadow-sm:0 4px 18px rgba(17,19,24,.055);
  --shadow-md:0 14px 40px rgba(17,19,24,.085);
  --radius:18px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 90% -10%,rgba(17,19,24,.035),transparent 28%),
    var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
img,svg,video,canvas{max-width:100%;height:auto}
button,input,select,textarea{max-width:100%}
table{border-collapse:collapse}
svg { display:inline-block; vertical-align:middle; }

.card,
.kpi,
.content-card,
.col{
  border-color:var(--border)!important;
  box-shadow:var(--shadow-sm);
}

.card{
  border-radius:var(--radius)!important;
}

.top{
  padding-bottom:2px;
}
.top h1{
  font-weight:750;
  letter-spacing:-1.1px;
}
.top p{
  color:#8a909a;
}

.vita-user-brand{
  background:rgba(255,255,255,.7);
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 12px;
  box-shadow:var(--shadow-sm);
}
.vita-user-brand b{
  letter-spacing:-.25px;
}

.btn{
  border-radius:11px!important;
  min-height:38px;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.btn:hover{
  transform:translateY(-1px);
}
.btn.primary,
.btn:not(.secondary){
  box-shadow:0 5px 15px rgba(17,19,24,.10);
}

.kpis{
  gap:14px!important;
}
.kpi{
  border-radius:16px!important;
  background:rgba(255,255,255,.88)!important;
  transition:transform .18s ease,box-shadow .18s ease;
}
.kpi:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.section-title{
  margin-top:26px!important;
}
.section-title h2{
  letter-spacing:-.35px;
  font-weight:750;
}

.table-wrap,.table-scroll,.card.scroll{
  max-width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

@media(max-width:680px){
  .main{
    padding:12px 11px 28px!important;
  }

  .top{
    gap:8px!important;
    margin-bottom:16px!important;
  }
  .top-left{min-width:0!important}
  .top h1{
    font-size:20px!important;
    line-height:1.12!important;
  }
  .top p{
    font-size:10px!important;
    line-height:1.35!important;
    max-width:190px;
  }

  .user.vita-user-brand{
    padding:7px 9px;
  }
  .vita-user-brand b{
    font-size:10px!important;
  }

  .kpis{
    grid-template-columns:1fr 1fr!important;
    gap:9px!important;
  }
  .kpi{
    min-width:0!important;
    padding:13px!important;
    min-height:101px!important;
  }
  .kpi .value{
    font-size:21px!important;
    line-height:1.1!important;
  }
  .kpi .label,.kpi .sub{
    font-size:9px!important;
    line-height:1.35!important;
  }

  .card{
    padding:13px!important;
  }

  .toolbar{
    display:grid!important;
    grid-template-columns:1fr!important;
    gap:8px!important;
  }
  .toolbar > *,
  .toolbar > div{
    width:100%!important;
    min-width:0!important;
  }
  .toolbar input,
  .toolbar select,
  .toolbar .btn{
    width:100%!important;
  }

  .modal-box,
  #modalBox{
    width:calc(100vw - 24px)!important;
    max-width:calc(100vw - 24px)!important;

let active = "dashboard", restricted = false;

let filterClient = "Todos";

const ACCOUNT_KEY = "vitaOS_current_user_v3";

function getCurrentUser(){
  return db.team.find(u => u.name === currentUserName) || db.team[0];
}

function updateCurrentUserUI(){
  const u = getCurrentUser();
  const name = document.getElementById("currentUser");
  const role = document.getElementById("currentRole");
  const avatar = document.getElementById("currentAvatar");
  if(name) name.textContent = u.name;
  if(role) role.textContent = u.role;
  if(avatar) avatar.textContent = u.name.charAt(0);
}

function openAccountSwitcher(){
  const box = document.getElementById("modalBox");

          <span><b>${u.name}</b><small>${u.role}</small></span>
          ${u.name===currentUserName ? `<span class="account-check">${icons.check}</span>` : ''}

      `).join("")}

    <div class="form-actions">
      <button class="btn secondary" type="button" onclick="closeModal()">Cancelar</button>
    </div>`;
  document.getElementById("modal").classList.add("show");
}

function loginAs(name){
  if(!VALID_USERS.includes(name)) return;
  currentUserName = name;
  localStorage.setItem(ACCOUNT_KEY, name);
  restricted = false;
  closeModal();
  updateCurrentUserUI();
  render();
  showToast(`Conta alterada para ${name}.`, icons.user);
}

// --- FUNÇÕES UTILITÁRIAS ---
function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[ch]));
}
function money(v){ return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) }
function showToast(msg, icon=icons.check) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span>${icon}</span> ${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 3000);
}
function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
function generateId() { return Math.floor(Math.random() * 1000000); }
function formatDateBR(dateString) {
  if(!dateString) return "Sem data";
  const [y, m, d] = dateString.split('-');
  return `${d}/${m}/${y}`;
}
function getFormatColor(format) {
  const colors = { "Reel": "purple", "Card": "blue", "Carrossel": "warn", "Edição de Vídeo": "good" };
  return colors[format] || "good";
}

// --- NAVEGAÇÃO ---
function nav(){
  const items = [
    ["dashboard","Dashboard", icons.dashboard], ["clientes","Clientes", icons.clientes], 
    ["conteudos","Conteúdos & Fluxo", icons.conteudos], ["calendario","Calendário", icons.calendario], 
    ["captacoes","Captações", icons.captacoes], ["tarefas","Tarefas", icons.tarefas], 
    ["equipe","Equipe", icons.equipe], ["relatorios","Relatórios", icons.relatorios], 
    ["gestao","Gestão Comercial", icons.gestao], ["config","Configurações", icons.config]
  ];
  document.getElementById("nav").innerHTML = items.map(([id, label, icon]) => {
    if(id === "gestao" && !restricted) return `<button class="restricted" onclick="openGate()"><span style="display:flex;align-items:center;gap:8px">${icons.lock} ${label}</span></button>`;
    if(id === "gestao" && restricted) return `<button class="restricted ${active===id?'active':''}" onclick="show('gestao')"><span style="display:flex;align-items:center;gap:8px">${icons.unlock} ${label}</span></button>`;
    return `<button class="${active===id?'active':''}" onclick="show('${id}')"><span style="display:flex;align-items:center;gap:8px">${icon} ${label}</span></button>`;
  }).join("");
}

function show(id){
  if(id === "gestao" && !restricted) { openGate(); return; }
  active = id; 
  document.getElementById("title").textContent = id === "gestao" ? "Gestão Comercial" : id.charAt(0).toUpperCase() + id.slice(1);
  document.getElementById("subtitle").textContent = id === "gestao" ? "Área restrita de faturamento" : "Operação da agência";
  if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
  render();
}

function localDateKey(date){
  const y=date.getFullYear(); const m=String(date.getMonth()+1).padStart(2,'0'); const d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function changeCalendarMonth(delta){
  calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + Number(delta), 1);
  calendarSelected = null;
  if(active !== "calendario") active = "calendario";
  render();
}
function goCalendarToday(){
  const now = new Date();
  calendarCursor = new Date(now.getFullYear(), now.getMonth(), 1);
  calendarSelected = localDateKey(now);
  render();
}
function openCalendarDay(key){
  calendarSelected = key;
  const captures = db.captures.filter(c=>c.date===key);
  const tasks = db.tasks.filter(t=>t.date===key);
  let html = `<h2>Agenda de ${formatDateBR(key)}</h2>`;
  html += `<p style="color:var(--muted);font-size:13px">${captures.length + tasks.length} evento(s) neste dia.</p>`;
  if(!captures.length && !tasks.length) html += `<div class="card" style="background:var(--surface-2);box-shadow:none"><p style="margin:0;color:var(--muted)">Nenhum evento cadastrado para este dia.</p></div>`;
  if(captures.length) html += `<h3 style="margin:18px 0 8px;display:flex;align-items:center;gap:6px">${icons.captacoes} Captações</h3>${captures.map(c=>`<div class="task"><div>${icons.captacoes}</div><div><b>${escapeHTML(c.client)}</b><small style="display:block;color:var(--muted)">${escapeHTML(c.time||'Sem horário')} · ${escapeHTML(c.loc||'Sem local')}<br>Responsável: ${escapeHTML(c.resp||'—')}</small></div></div>`).join('')}`;
  if(tasks.length) html += `<h3 style="margin:18px 0 8px;display:flex;align-items:center;gap:6px">${icons.tarefas} Tarefas</h3>${tasks.map(t=>`<div class="task"><div>${icons.check}</div><div><b>${escapeHTML(t.title)}</b><small style="display:block;color:var(--muted)">${escapeHTML(t.status||'A fazer')} · Responsável: ${escapeHTML(t.resp||'—')}</small></div></div>`).join('')}`;
  html += `<div class="form-actions"><button class="btn secondary" onclick="closeModal()">Fechar</button></div>`;
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

  const calYear = calendarCursor.getFullYear();

  let calHTML = '';

  for(let day=1; day<=daysInMonth; day++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

          <button type="button" class="task-edit-btn" onclick="openTaskEditor(${t.id})" style="display:flex;align-items:center;gap:4px">${icons.edit} Editar</button>

  // Equipe

    ${db.team.map(t => `

  // Relatórios
  out += page("relatorios", `

      <table class="table">

  // Gestão Financeira
  if(restricted) {

          ${db.clients.sort((a,b)=>b.value-a.value).map(c=>`<tr><td>${c.name}</td><td><span style="font-size:11px;color:var(--muted)">${c.services}</span></td><td><b>${money(c.value)}</b></td><td><span class="pill good">Em dia</span></td></tr>`).join("")}

  document.getElementById("pages").innerHTML = out;
}

// --- FUNÇÕES DE AÇÃO (CRUD) ---
const TASK_STATUSES = ["A fazer","Em andamento","Em revisão","Concluída"];

function setTaskStatus(id, status){
  const task = db.tasks.find(t => t.id === id);
  if(!task || !TASK_STATUSES.includes(status)) return;
  task.status = status;
  saveData();
  render();
  showToast(`Situação alterada para "${status}".`, status==="Concluída" ? icons.check : icons.refresh);
}

function toggleTaskStatus(id){
  const task = db.tasks.find(t => t.id === id);
  if(!task) return;
  setTaskStatus(id, task.status === "Concluída" ? "A fazer" : "Concluída");
}

function setTaskAssignee(id, resp){
  const task = db.tasks.find(t => t.id === id);
  if(!task) return;
  task.resp = resp;
  saveData();
  render();
  showToast(`Responsável alterado para ${resp}.`, icons.user);
}

function openTaskEditor(id){
  const task = db.tasks.find(t => t.id === id);
  if(!task) return;

  document.getElementById("modalBox").innerHTML = `
    <h2>Editar tarefa</h2>
    <div class="form">
      <label>Tarefa
        <input id="editTaskTitle" type="text" value="${escapeHTML(task.title)}">
      </label>
      <label>Situação atual
        <select id="editTaskStatus">
          ${TASK_STATUSES.map(st=>`<option value="${st}" ${task.status===st?"selected":""}>${st}</option>`).join("")}
        </select>
      </label>
      <label>Responsável
        <select id="editTaskResp">
          ${db.team.map(u=>`<option value="${u.name}" ${task.resp===u.name?"selected":""}>${u.name}</option>`).join("")}
        </select>
      </label>
      <label>Prazo
        <input id="editTaskDate" type="date" value="${task.date || ""}">
      </label>
      <label>Prioridade
        <select id="editTaskPrio">
          ${["Normal","Alta","Urgente"].map(p=>`<option value="${p}" ${task.prio===p?"selected":""}>${p}</option>`).join("")}
        </select>
      </label>
      <label>Observações
        <textarea id="editTaskNotes" rows="5" placeholder="Ex.: aguardar retorno do cliente, referência, detalhe da execução...">${escapeHTML(task.notes || "")}</textarea>
      </label>
      <div class="form-actions">
        <button class="btn secondary" type="button" onclick="closeModal()">Cancelar</button>
        <button class="btn" type="button" onclick="saveTaskEditor(${id})">Salvar alterações</button>
      </div>
    </div>`;
  document.getElementById("modal").classList.add("show");
}

function saveTaskEditor(id){
  const task = db.tasks.find(t => t.id === id);
  if(!task) return;

  const title = document.getElementById("editTaskTitle").value.trim();
  if(!title){
    alert("Informe o nome da tarefa.");
    return;
  }

  task.title = title;
  task.status = document.getElementById("editTaskStatus").value;
  task.resp = document.getElementById("editTaskResp").value;
  task.date = document.getElementById("editTaskDate").value;
  task.prio = document.getElementById("editTaskPrio").value;
  task.notes = document.getElementById("editTaskNotes").value.trim();

  saveData();
  closeModal();
  render();
  showToast("Tarefa atualizada com sucesso.", icons.check);
}

function openClientEditor(id){
  const client = db.clients.find(c => c.id === id);
  if(!client) return;

  document.getElementById("modalBox").innerHTML = `
    <h2 style="display:flex;align-items:center;gap:8px">${icons.edit} Editar cliente</h2>

      <input id="clientEditPassword" type="password" placeholder="Digite a senha"
             autocomplete="off" inputmode="numeric" maxlength="20"
             onkeydown="if(event.key==='Enter') confirmClientEditPassword(${id})">
      <div id="clientEditPasswordError" style="min-height:18px;color:#a8473f;font-size:12px;font-weight:700"></div>
      <div class="form-actions">
        <button class="btn secondary" type="button" onclick="closeModal()">Cancelar</button>
        <button class="btn" type="button" onclick="confirmClientEditPassword(${id})">Entrar</button>
      </div>
    </div>`;
  document.getElementById("modal").classList.add("show");
  setTimeout(() => document.getElementById("clientEditPassword")?.focus(), 80);
}

function confirmClientEditPassword(id){
  const input = document.getElementById("clientEditPassword");
  const error = document.getElementById("clientEditPasswordError");

  if(input && input.value === "1007"){
    closeModal();
    openClientEditorUnlocked(id);
    return;
  }

  if(error) error.textContent = "Senha incorreta.";
  if(input){
    input.value = "";
    input.focus();
  }
}

  const client = db.clients.find(c=>c.id===id);

      <label>Cliente / Marca<input id="editClientName" value="${escapeHTML(client.name)}"></label>
      <label>Valor mensal (R$)<input id="editClientValue" type="number" value="${escapeHTML(client.value)}"></label>
      <label>Escopo de serviços<input id="editClientServices" value="${escapeHTML(client.services||'')}"></label>
      <label>Responsável pelo atendimento<select id="editClientResp">${db.team.map(u=>`<option value="${escapeHTML(u.name)}" ${client.resp===u.name?'selected':''}>${escapeHTML(u.name)}</option>`).join('')}</select></label>
      <label>Situação<select id="editClientStatus">${['Ativo','Pausado','Encerrado','Prospect'].map(st=>`<option value="${st}" ${client.status===st?'selected':''}>${st}</option>`).join('')}</select></label>
      <label>Dia do fechamento do contrato<input id="editClientClosingDay" type="number" min="1" max="31" value="${escapeHTML(client.closingDay||'')}" placeholder="Ex: 10"></label>
      <label>Instagram / @<input id="editClientInstagram" value="${escapeHTML(client.instagram||'')}" placeholder="@cliente"></label>
      <label>Observações<textarea id="editClientNotes" rows="6" placeholder="Informações importantes...">${escapeHTML(client.notes||'')}</textarea></label>
      <div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveClientEditor(${id})">Salvar alterações</button></div>
    </div>`;
  document.getElementById('modal').classList.add('show');
}
function saveClientEditor(id){
  const client=db.clients.find(c=>c.id===id); if(!client) return;
  const name=document.getElementById('editClientName').value.trim();
  if(!name){ alert('Informe o nome do cliente.'); return; }
  const day=document.getElementById('editClientClosingDay').value.trim();
  if(day && (Number(day)<1 || Number(day)>31)){ alert('O dia de fechamento deve estar entre 1 e 31.'); return; }
  client.name=name; client.value=document.getElementById('editClientValue').value; client.services=document.getElementById('editClientServices').value.trim(); client.resp=document.getElementById('editClientResp').value; client.status=document.getElementById('editClientStatus').value; client.closingDay=day; client.instagram=document.getElementById('editClientInstagram').value.trim().replace(/^@+/,''); client.notes=document.getElementById('editClientNotes').value.trim();
  saveData(); closeModal(); render(); showToast('Cliente atualizado com sucesso.', icons.check);
}

function deleteItem(table, id) {
  if(confirm("Tem certeza que deseja excluir?")) {
    db[table] = db[table].filter(item => item.id !== id);
    saveData(); render(); showToast("Item removido da plataforma.", icons.delete);
  }
}

function filterTable(tableId, value) {
  const rows = document.querySelectorAll(`#${tableId} tbody tr`);
  rows.forEach(r => {
    r.style.display = r.innerText.toLowerCase().includes(value.toLowerCase()) ? "" : "none";
  });
}

// --- DRAG AND DROP (KANBAN) ---
function dragStart(e, id) { e.dataTransfer.setData('text/plain', id); }
function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dropContent(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = Number(e.dataTransfer.getData('text/plain'));
  const content = db.contents.find(c => c.id === id);
  if(content && content.stage !== stage) {
    content.stage = stage;
    saveData(); render();
  }
}

// --- SISTEMA DE MODAIS (FORMULÁRIOS DINÂMICOS) ---

  },
  task: {

    fields: [

      { id: "resp", label: "Quem vai fazer?", type: "select", options: ["Guilherme", "Eloize", "Elen", "Gabriel"] },
      { id: "date", label: "Prazo final", type: "date" },
      { id: "prio", label: "Prioridade", type: "select", options: ["Normal", "Alta", "Urgente"] },
      { id: "notes", label: "Observações (opcional)", type: "textarea", placeholder: "Detalhes, contexto, referências ou instruções..." }
    ],
    save: (data) => {

        id: generateId(),

      });

  content: {

    fields: [

      { id: "client", label: "Cliente", type: "select", options: () => db.clients.map(c=>c.name) },
      { id: "format", label: "Formato", type: "select", options: ["Reel", "Card", "Carrossel", "Edição de Vídeo", "Stories"] },
      { id: "resp", label: "Responsável atual (quem está com a bola?)", type: "select", options: ["Guilherme", "Eloize", "Elen", "Gabriel"] },
      { id: "link", label: "Link de Referência ou Drive (Opcional)", type: "text", placeholder: "https://drive.google.com/..." },
      { id: "notes", label: "Observações (opcional)", type: "textarea", placeholder: "Briefing, alterações, pendências..." }
    ],
    save: (data) => { db.contents.push({id: generateId(), title: data.title, client: data.client, format: data.format, resp: data.resp, link: data.link, notes: data.notes || "", stage: "IDEIA"}); }
  },
  capture: {

    fields: [
      { id: "client", label: "Cliente", type: "select", options: () => db.clients.map(c=>c.name) },

      { id: "time", label: "Horário", type: "time" },
      { id: "loc", label: "Localização", type: "text" },
      { id: "resp", label: "Quem fará a captação?", type: "select", options: () => db.team.map(u=>u.name) }
    ],
    save: (data) => { db.captures.push({id: generateId(), client: data.client, date: data.date, time: data.time, loc: data.loc, resp: data.resp}); }
  }

let currentFormType = null;

function openModal(type) {
  currentFormType = type;
  const config = forms[type];
  let html = `<h2>${config.title}</h2><div class="form">`;
  
  config.fields.forEach(f => {
    html += `<label>${f.label}`;
    if(f.type === 'select') {
      const opts = typeof f.options === 'function' ? f.options() : f.options;
      html += `<select id="input_${f.id}">${opts.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>`;
    } else if(f.type === 'textarea') {
      html += `<textarea id="input_${f.id}" rows="4" placeholder="${f.placeholder||''}"></textarea>`;
    } else {
      html += `<input type="${f.type}" id="input_${f.id}" placeholder="${f.placeholder||''}">`;
    }
    html += `</label>`;
  });

  html += `<div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button> <button class="btn" onclick="submitModal()">Salvar Dados</button></div></div>`;
  
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}

function submitModal() {
  const config = forms[currentFormType];
  const data = {};
  let valid = true;
  
  config.fields.forEach(f => {
    const val = document.getElementById(`input_${f.id}`).value;
    if(f.type !== 'text' || f.id !== 'link') { 
      if(!val) valid = false;
    }
    data[f.id] = val;
  });

  if(!valid) { alert("Preencha todos os campos obrigatórios."); return; }
  
  config.save(data);
  saveData();
  closeModal();
  render();
  showToast(`${config.title} criado com sucesso!`);
}

function closeModal() { document.getElementById("modal").classList.remove("show"); }

function openGate() {
  document.getElementById("modalBox").innerHTML = `
    <h2 style="display:flex;align-items:center;gap:8px">${icons.lock} Acesso Restrito</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:15px">O faturamento e dados comerciais são restritos à Diretoria.</p>
    <div class="form">
      <input id="gatePass" type="password" placeholder="Digite a senha" autofocus autocomplete="off" readonly onfocus="this.removeAttribute('readonly');">
      <div class="form-actions">
        <button class="btn secondary" onclick="closeModal()">Cancelar</button> 
        <button class="btn" onclick="unlock()">Desbloquear</button>
      </div>
    </div>`;
  document.getElementById("modal").classList.add("show");
  setTimeout(()=>document.getElementById("gatePass").focus(), 100);
}

function unlock() {
  if(document.getElementById("gatePass").value === "1007") {
    restricted = true; closeModal(); show("gestao"); showToast("Faturamento Desbloqueado.", icons.unlock);
  } else {
    alert("Acesso negado. Senha incorreta.");
  }
}

updateCurrentUserUI();
render();

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
});
